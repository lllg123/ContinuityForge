name: ContinuityForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate MoonBit and JavaScript integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s 0.10.14+7d59c7ec9
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code

      - name: Test all targets
        run: moon test --target all

      - name: Build all targets
        run: moon build --target all --deny-warn

      - name: Verify browser MoonBit engine
        run: |
          moon build web/engine --target js --release --deny-warn
          node integration/js/engine-parity.mjs
          node integration/js/web-engine.mjs
          node integration/js/scheduling-workspace.mjs

      - name: Verify RCPSP v2 scenarios and constraints
        run: |
          moon build cmd/rcpsp --target js --release --deny-warn
          node examples/rcpsp/check.mjs
          node --check benchmark/rcpsp/run.mjs

      - name: Check CP-SAT scenario reference
        run: |
          python3 -m venv /tmp/continuityforge-reference
          /tmp/continuityforge-reference/bin/python -m pip install -r benchmark/reference/requirements.txt
          /tmp/continuityforge-reference/bin/python benchmark/reference/check_scenarios.py

      - name: Run minimal domain example
        run: moon run examples/minimal

      - name: Run resource scheduling example
        run: moon run examples/recovery_window

      - name: Run CI pipeline scheduling example
        run: moon run examples/ci_pipeline

      - name: Run JavaScript integration probe
        run: node integration/js/smoke.mjs

      - name: Check Web JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/scheduling.js
